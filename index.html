<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>중부발전 현장교육 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
<style>
:root{--bg:#FFF;--bg-s:#F7F8FA;--bg-m:#F5F5F5;--bd:#E5E5E5;--bd-s:#D1D1D1;--t1:#1a1a1a;--t2:#666;--t3:#999;--accent:#5E56FF;--blue:#3B82F6;--red:#EF4444;--font:'Pretendard Variable',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg-m);color:var(--t1);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.w{max-width:420px;width:100%;background:var(--bg);min-height:100vh;min-height:100dvh}
.hd{padding:20px 16px 14px}
.hd h1{font-size:17px;font-weight:700;color:#000;letter-spacing:-.4px}
.hd p{font-size:11px;color:var(--t3);margin-top:3px;letter-spacing:-.1px}
.tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 16px}
.tab{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;position:relative;transition:color .12s;font-family:var(--font);letter-spacing:-.3px}
.tab:hover{color:var(--t1)}.tab.on{color:var(--accent);font-weight:600}
.tab.on::after{content:'';position:absolute;bottom:-1px;left:16px;right:16px;height:2px;background:var(--accent);border-radius:1px}
.tc{display:none}.tc.on{display:block}
.pills{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--bd)}
.pill{background:none;border:1px solid var(--bd);border-radius:4px;padding:5px 14px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .12s;font-family:var(--font);letter-spacing:-.2px}
.pill:hover{border-color:var(--bd-s);color:var(--t1)}.pill.on{background:var(--t1);border-color:var(--t1);color:#fff}
.st{width:100%;border-collapse:collapse}
.st th{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.2px;text-align:left;padding:7px 3px;border-bottom:1px solid var(--bd);white-space:nowrap}
.st th:first-child{padding-left:16px}.st th:last-child{padding-right:16px;text-align:center}
.st td{font-size:12px;font-weight:500;color:var(--t1);padding:10px 3px;border-bottom:1px solid #F0F0F0;letter-spacing:-.2px;white-space:nowrap;vertical-align:middle}
.st td:first-child{padding-left:16px}.st td:last-child{padding-right:16px;text-align:center}
.st tbody tr{cursor:pointer;transition:background .1s}
.st tbody tr:nth-child(even){background:var(--bg-s)}
.st tbody tr:active{background:#EFEFEF !important}
.st tbody tr.past{opacity:.3}
.st tbody tr.today{background:rgba(94,86,255,.05) !important}
.st tbody tr.today td:first-child{border-left:3px solid var(--accent);padding-left:13px}
.td-date{font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
.td-inst{display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.d-b{background:var(--blue)}.d-r{background:var(--red)}
.inst-b{color:var(--blue);font-weight:600;font-size:11px}.inst-r{color:var(--red);font-weight:600;font-size:11px}
.td-loc{font-weight:600}.td-venue{color:var(--t2);font-weight:400}
.td-time{font-variant-numeric:tabular-nums;font-weight:500;font-size:11px}
.td-arr{color:var(--t3)}.st tbody tr:hover .td-arr{color:var(--t1)}

.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.22);display:none;justify-content:center;align-items:flex-end;z-index:100}
.ov.show{display:flex}
.dp{background:var(--bg);width:100%;max-width:420px;max-height:88vh;max-height:88dvh;overflow-y:auto;border-radius:12px 12px 0 0;animation:su .22s cubic-bezier(.32,.72,0,1);-webkit-overflow-scrolling:touch}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dp-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:1}
.dp-title{font-size:16px;font-weight:700;color:#000;letter-spacing:-.4px}
.dp-close{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex;transition:color .1s}
.dp-close:hover{color:var(--t1)}
.dp-body{padding:0 16px 28px}
.dp-row{padding:12px 0;border-bottom:1px solid #F0F0F0}
.dp-row:last-child{border-bottom:none}
.dp-lbl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:5px}

/* Summary line - color coded */
.dp-sum{font-size:14px;letter-spacing:-.2px;line-height:1.6;display:flex;align-items:center;gap:0;flex-wrap:wrap}
.dp-sum .s-date{font-weight:700;color:var(--t1)}
.dp-sum .s-sep{color:var(--t3);margin:0 6px;font-size:12px}
.dp-sum .s-time{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.dp-sum .s-venue{font-weight:600;color:var(--blue)}

.il{display:flex;align-items:center;justify-content:space-between;gap:8px}
.il-txt{font-size:13px;font-weight:500;color:var(--t1);letter-spacing:-.2px;line-height:1.4;min-width:0}
.il-btns{display:flex;gap:4px;flex-shrink:0}

/* Context items */
.ctx-item{font-size:12px;color:var(--t1);letter-spacing:-.2px;padding:3px 0;font-weight:500}
.ctx-item .ctx-time{color:var(--t2);font-variant-numeric:tabular-nums}
.ctx-empty{font-size:12px;color:var(--t3)}
.ent-url{font-size:10px;color:var(--t3);word-break:break-all;margin-top:4px;line-height:1.4;letter-spacing:-.1px}
.ent-row{margin-top:6px}

.ib{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid var(--bd);border-radius:6px;cursor:pointer;color:var(--t2);transition:all .12s;text-decoration:none;flex-shrink:0}
.ib:hover{border-color:var(--bd-s);color:var(--t1);background:var(--bg-s)}.ib:active{background:var(--bg-m)}
.ib.call{color:var(--blue);border-color:rgba(59,130,246,.2)}.ib.call:hover{border-color:var(--blue)}
.ib.sms{color:var(--accent);border-color:rgba(94,86,255,.2)}.ib.sms:hover{border-color:var(--accent)}
.bt-primary{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;background:var(--t1);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s;font-family:var(--font);letter-spacing:-.2px;margin-top:4px}
.bt-primary:hover{background:#333}.bt-primary:active{background:#000}

.ct-sec{padding:12px 16px 20px}
.ct-lbl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;padding-bottom:8px;display:flex;align-items:center;gap:6px}
.ct-feat{border:1px solid rgba(94,86,255,.12);border-radius:8px;padding:12px;margin-bottom:16px}
.ct-feat .il{margin-bottom:4px}
.ct-feat-tag{font-size:9px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:4px}
.ct-feat-name{font-size:14px;font-weight:700;color:var(--t1);letter-spacing:-.3px}
.ct-feat-sub{font-size:11px;color:var(--t2);margin-top:2px;font-variant-numeric:tabular-nums}
.ct-tbl{width:100%;border-collapse:collapse}
.ct-tbl tr{border-bottom:1px solid #F0F0F0}.ct-tbl tr:last-child{border-bottom:none}
.ct-tbl td{padding:9px 0;vertical-align:middle}
.ct-info-cell{padding-right:8px}
.ct-l1{font-size:12px;font-weight:600;color:var(--t1);letter-spacing:-.2px;white-space:nowrap}
.ct-l1 .rg{color:var(--t3);font-weight:500;font-size:11px}
.ct-l2{font-size:10px;color:var(--t2);margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.1px}
.ct-btn-cell{white-space:nowrap;text-align:right;width:1%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--t1);color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:500;z-index:200;opacity:0;transition:all .2s;pointer-events:none;letter-spacing:-.2px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

let filt='all';const now=new Date();now.setHours(0,0,0,0);

function rSch(){
  const el=document.getElementById('sl');
  const list=filt==='all'?SC:SC.filter(s=>s.in===filt);
  el.innerHTML=list.map(s=>{
    const sd=new Date(s.d);sd.setHours(0,0,0,0);
    let cls='';if(sd<now)cls='past';if(sd.getTime()===now.getTime())cls='today';
    const dc=s.in==='두느'?'d-b':'d-r',ic=s.in==='두느'?'inst-b':'inst-r';
    return`<tr class="${cls}" onclick="oDtl(${s.i})">
<td class="td-date">${s.dt}(${s.dy})</td>
<td><span class="td-inst"><span class="dot ${dc}"></span><span class="${ic}">${s.in}</span></span></td>
<td class="td-loc">${s.lo}</td>
<td class="td-venue">${s.vn}</td>
<td class="td-time">${s.ts}</td>
<td class="td-arr">${IC.chev}</td></tr>`}).join('');
}

function rCt(){
  document.getElementById('ct-list').innerHTML=CT.map(c=>`<tr>
<td class="ct-info-cell">
<div class="ct-l1"><span class="rg">${c.r}</span> ${c.n} ${c.t}${c.sub?' <span class="rg">/ '+c.sub+'</span>':''}</div>
<div class="ct-l2">${c.p} &middot; ${c.e}</div>
</td>
<td class="ct-btn-cell"><div style="display:flex;gap:4px;justify-content:flex-end">
<a href="tel:${c.p}" class="ib call">${IC.ph}</a>
<button class="ib" onclick="cp('${c.e}')">${IC.mail}</button>
</div></td></tr>`).join('');
}

function oDtl(idx){
  const s=SC[idx];if(!s)return;const c=s.ct;
  let cxH='';
  if(!s.cx.length) cxH='<div class="ctx-empty">해당 없음</div>';
  else cxH=s.cx.map(x=>`<div class="ctx-item">${x.t}${x.d?' <span class="ctx-time">('+x.d+')</span>':''}</div>`).join('');

  let entH='';
  if(s.ent){const e=s.ent;entH=`<div class="dp-row"><div class="dp-lbl">출입 정보</div>
<div class="il"><div class="il-txt" style="font-size:12px;font-weight:600">출입 QR</div><div class="il-btns"><a href="${e.qr}" target="_blank" rel="noopener" class="ib" title="열기" style="color:var(--accent);border-color:rgba(94,86,255,.2)">${IC.link}</a><button class="ib" onclick="cp('${e.qr}')">${IC.cp}</button></div></div>
<div class="ent-url">${e.qr}</div>
<div class="ent-row"><div class="il"><div class="il-txt" style="font-size:12px"><span style="color:var(--t3)">출입번호</span> ${e.vn}</div><div class="il-btns"><button class="ib" onclick="cp('${e.vn}')">${IC.cp}</button></div></div></div>
<div class="ent-row"><div class="il"><div class="il-txt" style="font-size:12px"><span style="color:var(--t3)">노트북</span> ${e.ln}</div><div class="il-btns"><button class="ib" onclick="cp('${e.ln}')">${IC.cp}</button></div></div></div>
</div>`;}

  document.getElementById('dp').innerHTML=`
<div class="dp-hd"><div class="dp-title">${s.lo}</div><button class="dp-close" onclick="clsDtl()">${IC.x}</button></div>
<div class="dp-body">
<div class="dp-row"><div class="dp-sum"><span class="s-date">${s.dt}(${s.dy})</span><span class="s-sep">&middot;</span><span class="s-time">${s.ts}</span><span class="s-sep">&middot;</span><span class="s-venue">${s.vn}</span></div></div>
<div class="dp-row"><div class="dp-lbl">교육장 주소</div><div class="il"><div class="il-txt">${s.addr}</div><div class="il-btns"><button class="ib" onclick="oMap('${s.addr}')" style="color:#10B981;border-color:rgba(16,185,129,.2)">${IC.nav}</button><button class="ib" onclick="cp('${s.addr}')">${IC.cp}</button></div></div></div>
<div class="dp-row"><div class="dp-lbl">담당자</div><div class="il"><div class="il-txt">${c.n} &middot; ${c.p}</div><div class="il-btns"><a href="tel:${c.p}" class="ib call">${IC.ph}</a><button class="ib" onclick="cp('${c.e}')">${IC.mail}</button></div></div></div>
${entH}<div class="dp-row"><div class="dp-lbl">앞뒤 일정</div>${cxH}</div>
<div class="dp-row" style="border:none;padding-bottom:0"><button class="bt-primary" onclick="doSms('${s.lo}')">${IC.msg} 완료문자 보내기</button></div>
</div>`;
  document.getElementById('ov').classList.add('show');document.body.style.overflow='hidden';
}

function clsDtl(e){if(e&&e.target&&e.target.closest&&e.target.closest('.dp'))return;document.getElementById('ov').classList.remove('show');document.body.style.overflow=''}
function cp(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('복사되었습니다'));else{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('복사되었습니다')}}
function oMap(addr){const e=encodeURIComponent(addr);window.open('https://map.naver.com/v5/search/'+e,'_blank')}
function doSms(loc){const b=loc?`대리님 안녕하세요, 금일 ${loc} 교육 특이 사항없이 잘 마무리 되었습니다. 좋은 하루 되세요 ☺`:`대리님 안녕하세요, 금일 교육 특이 사항없이 잘 마무리 되었습니다. 좋은 하루 되세요 ☺`;const enc=encodeURIComponent(b);const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent);window.location.href=`sms:010-2992-0334${iOS?'&':'?'}body=${enc}`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}
function swTab(id,btn){document.querySelectorAll('.tc').forEach(e=>e.classList.remove('on'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));document.getElementById('tc-'+id).classList.add('on');btn.classList.add('on')}
function setF(f,btn){filt=f;document.querySelectorAll('.pill').forEach(e=>e.classList.remove('on'));btn.classList.add('on');rSch()}
rSch();rCt();
